<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Prediction</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            font-family: Arial, sans-serif;
        }

        .container-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            margin-top: 50px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .btn-custom {
            width: 100%;
            font-size: 18px;
        }

        .result {
            text-align: center;
            font-size: 20px;
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="container-box col-md-6 offset-md-3">

        <h2>🩺 Diabetes Prediction</h2>

        <form action="/predict" method="post">

            <div class="mb-3">
                <label>Pregnancies</label>
                <input type="number" step="any" name="pregnancies" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Glucose</label>
                <input type="number" step="any" name="glucose" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Blood Pressure</label>
                <input type="number" step="any" name="bloodpressure" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Skin Thickness</label>
                <input type="number" step="any" name="skinthickness" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Insulin</label>
                <input type="number" step="any" name="insulin" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>BMI</label>
                <input type="number" step="any" name="bmi" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Diabetes Pedigree Function</label>
                <input type="number" step="any" name="dpf" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Age</label>
                <input type="number" step="any" name="age" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary btn-custom">Predict</button>

        </form>

        <div class="result">
            {{ prediction_text }}
        </div>

    </div>
</div>

</body>
</html>
